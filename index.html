<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Prüfungsgebiete – Fahrtraining</title>
<style>
:root{
  --bg:#f4f6f8; --card:#fff; --text:#111827; --muted:#6b7280; --line:#e5e7eb;
  --good:#22c55e; --good-bg:#dcfce7;
  --mid:#eab308; --mid-bg:#fef9c3;
  --bad:#ef4444; --bad-bg:#fee2e2;
  --none:#f3f4f6;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:10;background:#111827;color:#fff;padding:18px 16px 14px;box-shadow:0 2px 10px #0002}
header h1{font-size:20px;margin:0 0 4px}
header p{font-size:13px;margin:0;color:#cbd5e1}
main{max-width:900px;margin:0 auto;padding:16px 12px 40px}
.student-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:0 1px 3px #0000000a}
.student-card h2{font-size:17px;margin:0 0 12px}
.student-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:700;color:#4b5563}
input{width:100%;border:1px solid #d1d5db;border-radius:9px;padding:10px;font-size:14px;background:#fff;color:#111827}
.student-actions{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.student-actions button{flex:1;min-width:110px}
.primary{background:#111827;color:#fff}
.danger{background:#fee2e2;color:#991b1b}
.student-info{margin-top:10px;padding:9px 10px;border-radius:9px;background:#f9fafb;color:#4b5563;font-size:13px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat strong{display:block;font-size:20px}
.stat small{color:var(--muted)}
.goodText{color:#15803d}.midText{color:#a16207}.badText{color:#b91c1c}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
button{border:0;border-radius:10px;padding:10px 12px;font-weight:700;cursor:pointer}
#reset{background:#e5e7eb;color:#111827}
.group{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 14px;overflow:hidden;box-shadow:0 1px 3px #0000000a}
.group h2{font-size:17px;margin:0;padding:13px 14px;background:#f9fafb;border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.label{font-size:14px;line-height:1.3}
select{width:100%;border:1px solid #d1d5db;border-radius:9px;padding:9px 30px 9px 10px;font-size:14px;font-weight:700;background:var(--none);color:#374151}
select[data-state="good"]{background:var(--good-bg);border-color:#86efac;color:#166534}
select[data-state="mid"]{background:var(--mid-bg);border-color:#fde047;color:#854d0e}
select[data-state="bad"]{background:var(--bad-bg);border-color:#fca5a5;color:#991b1b}
.note{font-size:12px;color:var(--muted);margin:4px 2px 16px}
footer{font-size:12px;color:var(--muted);text-align:center;padding:8px}
@media(max-width:560px){
 .student-grid{grid-template-columns:1fr}
 .row{grid-template-columns:1fr 145px;padding:10px}
 .label{font-size:13px}
 select{font-size:13px;padding:8px 26px 8px 8px}
}

@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;color:#000;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  header{position:static;box-shadow:none;padding:10px 0 12px;background:#fff;color:#000;border-bottom:2px solid #111827}
  header p{color:#4b5563}
  main{max-width:none;padding:10px 0 0}
  .student-grid,.toolbar,.note,#reset,#printBtn{display:none!important}
  .student-card{box-shadow:none;border:1px solid #bbb;margin-bottom:10px;padding:10px;break-inside:avoid}
  .student-card h2{margin-bottom:6px}
  .student-info{background:#fff;padding:0;color:#000;font-size:14px;font-weight:700}
  .summary{gap:6px;margin-bottom:10px;break-inside:avoid}
  .stat{box-shadow:none;border:1px solid #bbb;padding:6px}
  .stat strong{font-size:16px}
  .group{box-shadow:none;border:1px solid #bbb;margin-bottom:8px;break-inside:avoid}
  .group h2{padding:7px 9px;background:#eee!important;font-size:14px}
  .row{grid-template-columns:minmax(0,1fr) 130px;padding:5px 8px;gap:6px}
  .label{font-size:11px}
  select{appearance:none;-webkit-appearance:none;border:1px solid #aaa;padding:4px 6px;font-size:10px;background-image:none!important;color:#000}
  select[data-state="good"]{background:#dcfce7!important;color:#166534!important;border-color:#86efac!important}
  select[data-state="mid"]{background:#fef9c3!important;color:#854d0e!important;border-color:#fde047!important}
  select[data-state="bad"]{background:#fee2e2!important;color:#991b1b!important;border-color:#fca5a5!important}
  footer{padding:6px 0 0}
}
</style>
</head>
<body>
<header>
  <h1>Prüfungsgebiete – Fahrtraining</h1>
  <p>Eigene Einschätzung der Strecken und Grundfahraufgaben</p>
</header>

<main>
  <section class="student-card">
    <h2>Fahrschüler</h2>
    <div class="student-grid">
      <div class="field">
        <label for="studentSelect">Fahrschüler auswählen</label>
        <select id="studentSelect">
          <option value="">– Fahrschüler auswählen –</option>
        </select>
      </div>
      <div class="field">
        <label for="studentName">Vorname Nachname</label>
        <input id="studentName" type="text" placeholder="z. B. Max Mustermann" autocomplete="off">
      </div>
      <div class="student-actions">
        <button id="addStudent" class="primary">Speichern</button>
        <button id="editStudent">Bearbeiten</button>
        <button id="deleteStudent" class="danger">Löschen</button>
      </div>
    </div>
    <div id="studentInfo" class="student-info">Noch kein Fahrschüler ausgewählt.</div>
  </section>

  <div class="summary">
    <div class="stat"><strong id="goodCount" class="goodText">0</strong><small>Sehr gut</small></div>
    <div class="stat"><strong id="midCount" class="midText">0</strong><small>Solala</small></div>
    <div class="stat"><strong id="badCount" class="badText">0</strong><small>Nochmal fahren</small></div>
  </div>

  <div class="toolbar"><button id="printBtn" class="primary">Drucken / PDF</button><button id="reset">Alle Bewertungen zurücksetzen</button></div>
  <div class="note">Die Auswahl wird automatisch auf diesem Gerät im Browser gespeichert.</div>

  <div id="groups"></div>
  <footer>Prüfungsgebiete Hattingen / Sprockhövel</footer>
</main>

<script>
const data = [
  {group:"Holthausen", items:[
    "Schule – von oben","Schule – von unten",
    "Holthausen – von oben","Holthausen – von unten",
    "Holthausen Sackgasse","Holthausen VB",
    "TÜV – von oben","TÜV – von unten"
  ]},
  {group:"Welper", items:[
    "Welper Stadt – FS Richtung Schule",
    "Welper Stadt – Schule Richtung Fahrschule",
    "Welper Sackgasse",
    "Welper Hochhaus – kleine Runde",
    "Welper Hochhaus – große Runde",
    "Hellweg – bergab","Hellweg – bergauf"
  ]},
  {group:"Blankenstein", items:[
    "Blankenstein KH Sackgasse","Blankenstein VB"
  ]},
  {group:"Sprockhövel", items:[
    "Querspange Richtung Haßlinghausen","Osterhöfgen","Glückaufhalle","Sportplatz"
  ]},
  {group:"Südstadt", items:[
    "Alte Feuerwehr links","Öko","Busbahnhof VB","Neue Feuerwehr","Grünstraße",
    "Nordstraße – KH Richtung Harzer","Nordstraße – andersrum",
    "Oberwinzerfeld",
    "Harzer – Richtung Avantgarde","Harzer – andersrum",
    "Talstraße – von oben","Talstraße – von unten",
    "Bahnhofstraße","Gegenüber McDonald's links","Salzweg",
    "Beschleunigungsstreifen Richtung Blankenstein",
    "Beschleunigungsstreifen Richtung Hattingen",
    "Polizei links",
    "Avantgarde Hotel / Cappadocia – Richtung Kreis",
    "Avantgarde Hotel / Cappadocia – andersrum",
    "Rechts vor links",
    "Rechts vor links Netto",
    "Avantgarde Sackgasse umkehren",
    "Avantgarde Ampel vor Netto"
  ]},
  {group:"Stopschilder", items:[
    "Oberwinzerfeld","TÜV","Diergardt","Stolle Stop","Osterhöfgen","Avantgarde","Hellweg","Talstraße","Abknickende Vorfahrtstraße"
  ]},
  {group:"Grundfahraufgaben", items:[
    "Parklücke","Parkbox (vorwärts)","Parkbox (rückwärts)","Umkehren","Gefahrbremsung"
  ]},
  {group:"Einbahnstraßen", items:[
    "Aldi","Marktplatz – kleine Runde","Marktplatz – große Runde","Tanzschule",
    "Hirschberger","Oberwinzerfeld","Avantgarde Hotel","Blankenstein"
  ]}
];

const STORAGE_KEY = "pruefungsgebiete-schueler-v2";

let appData = {
  students: [],
  selectedStudentId: null,
  ratings: {}
};

try {
  const loaded = JSON.parse(localStorage.getItem(STORAGE_KEY));
  if (loaded && typeof loaded === "object") {
    appData = {
      students: Array.isArray(loaded.students) ? loaded.students : [],
      selectedStudentId: loaded.selectedStudentId || null,
      ratings: loaded.ratings && typeof loaded.ratings === "object" ? loaded.ratings : {}
    };
  }
} catch(e) {}

function saveApp(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
}

function idFor(group,item){ return group + "||" + item; }

function stateFromValue(v){
  if(v==="Sehr gut") return "good";
  if(v==="Solala") return "mid";
  if(v==="Nochmal fahren") return "bad";
  return "none";
}

function getCurrentStudent(){
  return appData.students.find(s => s.id === appData.selectedStudentId) || null;
}

function getCurrentRatings(){
  if(!appData.selectedStudentId) return {};
  if(!appData.ratings[appData.selectedStudentId]) appData.ratings[appData.selectedStudentId] = {};
  return appData.ratings[appData.selectedStudentId];
}

function renderStudents(){
  const select = document.getElementById("studentSelect");
  const current = appData.selectedStudentId || "";
  select.innerHTML = '<option value="">– Fahrschüler auswählen –</option>';

  appData.students
    .slice()
    .sort((a,b)=>a.name.localeCompare(b.name,"de"))
    .forEach(student=>{
      const opt = document.createElement("option");
      opt.value = student.id;
      opt.textContent = student.name;
      select.appendChild(opt);
    });

  select.value = current;
  updateStudentInfo();
}

function updateStudentInfo(){
  const info = document.getElementById("studentInfo");
  const student = getCurrentStudent();

  if(!student){
    info.textContent = "Noch kein Fahrschüler ausgewählt.";
    return;
  }

  const ratings = getCurrentRatings();
  const rated = Object.keys(ratings).length;
  info.textContent = "Aktuell: " + student.name + " · " + rated + " Einträge bewertet";
}

function addStudent(){
  const input = document.getElementById("studentName");
  const name = input.value.trim();

  if(!name){
    alert("Bitte Vorname und Nachname eingeben.");
    return;
  }

  const exists = appData.students.some(s => s.name.toLowerCase() === name.toLowerCase());
  if(exists){
    alert("Dieser Fahrschüler ist bereits gespeichert.");
    return;
  }

  const id = "s_" + Date.now() + "_" + Math.random().toString(36).slice(2,7);
  appData.students.push({id, name});
  appData.ratings[id] = {};
  appData.selectedStudentId = id;

  input.value = "";
  saveApp();
  renderStudents();
  render();
}

function editStudent(){
  const student = getCurrentStudent();
  if(!student){
    alert("Bitte zuerst einen Fahrschüler auswählen.");
    return;
  }

  const input = document.getElementById("studentName");
  const proposed = input.value.trim() || prompt("Neuer Name:", student.name);
  if(proposed === null) return;

  const name = proposed.trim();
  if(!name) return;

  const duplicate = appData.students.some(s => s.id !== student.id && s.name.toLowerCase() === name.toLowerCase());
  if(duplicate){
    alert("Ein Fahrschüler mit diesem Namen existiert bereits.");
    return;
  }

  student.name = name;
  input.value = "";
  saveApp();
  renderStudents();
  render();
}

function deleteStudent(){
  const student = getCurrentStudent();
  if(!student){
    alert("Bitte zuerst einen Fahrschüler auswählen.");
    return;
  }

  if(!confirm('Fahrschüler "' + student.name + '" wirklich löschen? Alle zugehörigen Bewertungen werden ebenfalls gelöscht.')){
    return;
  }

  appData.students = appData.students.filter(s => s.id !== student.id);
  delete appData.ratings[student.id];
  appData.selectedStudentId = null;

  saveApp();
  renderStudents();
  render();
}

function render(){
  const root = document.getElementById("groups");
  root.innerHTML = "";

  const student = getCurrentStudent();
  const ratings = getCurrentRatings();

  data.forEach(section=>{
    const card = document.createElement("section");
    card.className = "group";
    const title = document.createElement("h2");
    title.textContent = section.group;
    card.appendChild(title);

    section.items.forEach(item=>{
      const row = document.createElement("div");
      row.className = "row";

      const label = document.createElement("div");
      label.className = "label";
      label.textContent = item;

      const sel = document.createElement("select");
      const key = idFor(section.group,item);
      const current = ratings[key] || "";

      sel.innerHTML = `
        <option value="">– auswählen –</option>
        <option value="Sehr gut">Sehr gut</option>
        <option value="Solala">Solala</option>
        <option value="Nochmal fahren">Nochmal fahren</option>`;

      sel.value = current;
      sel.dataset.state = stateFromValue(current);
      sel.disabled = !student;
      sel.setAttribute("aria-label", item + " bewerten");

      sel.addEventListener("change",()=>{
        const currentRatings = getCurrentRatings();
        if(sel.value) currentRatings[key] = sel.value;
        else delete currentRatings[key];

        saveApp();
        sel.dataset.state = stateFromValue(sel.value);
        updateCounts();
        updateStudentInfo();
      });

      row.append(label,sel);
      card.appendChild(row);
    });

    root.appendChild(card);
  });

  updateCounts();
  updateStudentInfo();
}

function updateCounts(){
  const ratings = getCurrentRatings();
  let good=0, mid=0, bad=0;

  Object.values(ratings).forEach(v=>{
    if(v==="Sehr gut") good++;
    if(v==="Solala") mid++;
    if(v==="Nochmal fahren") bad++;
  });

  document.getElementById("goodCount").textContent = good;
  document.getElementById("midCount").textContent = mid;
  document.getElementById("badCount").textContent = bad;
}

document.getElementById("studentSelect").addEventListener("change", e=>{
  appData.selectedStudentId = e.target.value || null;
  saveApp();
  render();
});

document.getElementById("addStudent").addEventListener("click", addStudent);
document.getElementById("editStudent").addEventListener("click", editStudent);
document.getElementById("deleteStudent").addEventListener("click", deleteStudent);

document.getElementById("studentName").addEventListener("keydown", e=>{
  if(e.key === "Enter") addStudent();
});

document.getElementById("reset").addEventListener("click",()=>{
  const student = getCurrentStudent();
  if(!student){
    alert("Bitte zuerst einen Fahrschüler auswählen.");
    return;
  }

  if(confirm('Alle Bewertungen für "' + student.name + '" zurücksetzen?')){
    appData.ratings[student.id] = {};
    saveApp();
    render();
  }
});

document.getElementById("printBtn").addEventListener("click",()=>{
  const student=getCurrentStudent();
  if(!student){
    alert("Bitte zuerst einen Fahrschüler auswählen.");
    return;
  }
  window.print();
});
renderStudents();
render();
</script>
</body>
</html>
